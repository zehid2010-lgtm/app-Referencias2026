<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referencias PRO</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#fff;
}

.container{
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

h2{
  margin-bottom:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.ok{color:#22c55e;}
.warn{color:#facc15;}
.bad{color:#ef4444;}

.total{
  font-size:22px;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h2>Evaluación Referencias</h2>

<div class="card">
  <div class="row">
    <span>Colas (15)</span>
    <input type="number" id="colas" value="0">
  </div>

  <div class="row">
    <span>Stills (20)</span>
    <input type="number" id="stills" value="0">
  </div>

  <div class="row">
    <span>Sabores (10)</span>
    <input type="number" id="sabores" value="0">
  </div>

  <div class="row">
    <span>Sabor Candado</span>
    <select id="candado">
      <option value="NO">NO</option>
      <option value="SI">SI</option>
    </select>
  </div>

  <div class="row">
    <span>Compra Crush</span>
    <select id="crush">
      <option value="NO">NO</option>
      <option value="SI">SI</option>
    </select>
  </div>

  <div class="row">
    <span>Fanta Manzana</span>
    <select id="manzana">
      <option value="NO">NO</option>
      <option value="SI">SI</option>
    </select>
  </div>

  <div class="row">
    <span>Multicategoría (5)</span>
    <input type="number" id="multi" value="0">
  </div>

  <button onclick="calcular()">Calcular</button>
</div>

<div class="card">
  <div class="row"><span>Colas</span><span id="pColas">0</span></div>
  <div class="row"><span>Stills</span><span id="pStills">0</span></div>
  <div class="row"><span>Sabores</span><span id="pSabores">0</span></div>
  <div class="row"><span>Multicategoría</span><span id="pMulti">0</span></div>

  <div class="total">
    Total: <span id="total">0</span> / 20
  </div>
</div>

</div>

<script>
function calcular(){

  let colas = parseInt(document.getElementById("colas").value) || 0;
  let stills = parseInt(document.getElementById("stills").value) || 0;
  let sabores = parseInt(document.getElementById("sabores").value) || 0;
  let multi = parseInt(document.getElementById("multi").value) || 0;

  let candado = document.getElementById("candado").value;
  let crush = document.getElementById("crush").value;
  let manzana = document.getElementById("manzana").value;

  let pColas = colas >= 15 ? 5 : 0;
  let pStills = stills >= 20 ? 5 : 0;

  // 🔴 CONDICIÓN SABORES (la que pediste)
  let pSabores = (sabores >= 10 && candado === "SI" && crush === "SI" && manzana === "SI") ? 5 : 0;

  let pMulti = multi >= 5 ? 5 : 0;

  let total = pColas + pStills + pSabores + pMulti;

  document.getElementById("pColas").innerText = pColas;
  document.getElementById("pStills").innerText = pStills;
  document.getElementById("pSabores").innerText = pSabores;
  document.getElementById("pMulti").innerText = pMulti;
  document.getElementById("total").innerText = total;
}
</script>

</body>
</html>
