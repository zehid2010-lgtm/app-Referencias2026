<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobertura por Cliente</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root{
  --rojo:#d6001c;
  --rojo-suave:#fdecec;
  --verde:#188038;
  --verde-suave:#eaf6ee;
  --gris:#f5f5f7;
  --borde:#d9d9de;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f2f2f2;
}

.header{
  background:linear-gradient(135deg,#d6001c,#a80015);
  color:white;
  text-align:center;
  padding:30px 20px;
}

.logo-text{
  font-family:'Brush Script MT','Segoe Script',cursive;
  font-size:48px;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-size:22px;
}

.sub{
  font-size:13px;
  opacity:0.9;
}

.content{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

input, select{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid var(--borde);
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.btn{
  background:var(--rojo);
  color:white;
  width:60%;
}

.btn-gray{
  background:#ddd;
  width:35%;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
}

.badge.total{background:#eee;}
.badge.ok{background:var(--verde-suave);color:var(--verde);}
.badge.no{background:var(--rojo-suave);color:var(--rojo);}

</style>
</head>

<body>

<div class="header">
  <div class="logo-text">Coca-Cola</div>
  <h1>Cobertura por Cliente</h1>
  <div class="sub">Productos comprados en verde y pendientes en rojo</div>
</div>

<div class="content">

<div class="card">
  <label>Buscar cliente o número</label>
  <input id="searchClient" placeholder="Ej: 3100979 o nombre">

  <label>Cliente</label>
  <select id="clienteSelect"></select>

  <label>Buscar producto</label>
  <input id="searchProducto" placeholder="Escribí un producto">

  <div class="row">
    <button class="btn" onclick="init()">Actualizar datos</button>
    <button class="btn-gray" onclick="limpiar()">Limpiar</button>
  </div>

  <div class="row" style="margin-top:10px">
    <div class="badge total">Total: <span id="total">0</span></div>
    <div class="badge ok">Comprados: <span id="ok">0</span></div>
    <div class="badge no">Pendientes: <span id="no">0</span></div>
  </div>

  <div id="msg" style="margin-top:10px;font-size:12px;color:#666"></div>

</div>

</div>

<script>

const SHEET_ID = "1SQAHZLQmBjkGeac7sEg9ChFQdwOVClcT";

const URL_CLIENTES = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=1063039588`;

let clientes = [];

function init(){
  document.getElementById("msg").innerText = "Cargando datos desde Drive...";

  Papa.parse(URL_CLIENTES, {
    download:true,
    header:true,
    complete:(res)=>{
      clientes = res.data;
      cargarClientes();
      document.getElementById("msg").innerText = "Datos cargados correctamente";
    },
    error:()=>{
      document.getElementById("msg").innerText = "Error al cargar datos";
    }
  });
}

function cargarClientes(){
  const select = document.getElementById("clienteSelect");
  select.innerHTML = "<option>Seleccionar cliente</option>";

  clientes.forEach(c=>{
    if(c.Numero){
      const opt = document.createElement("option");
      opt.value = c.Numero;
      opt.text = `${c.Numero} - ${c.Cliente}`;
      select.appendChild(opt);
    }
  });
}

function limpiar(){
  document.getElementById("searchClient").value="";
  document.getElementById("searchProducto").value="";
}

init();

</script>

</body>
</html>
