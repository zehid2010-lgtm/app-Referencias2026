<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobertura por Cliente</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root{
  --rojo:#d6001c;
  --rojo-suave:#fdecec;
  --verde:#188038;
  --verde-suave:#eaf6ee;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f5f5f7;
}

.header{
  background:linear-gradient(135deg,#d6001c,#b80018);
  color:white;
  text-align:center;
  padding:25px 15px;
}

.logo-text{
  font-family:'Brush Script MT', cursive;
  font-size:42px;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:20px;
}

p{
  margin:5px 0 0;
  font-size:13px;
}

.content{
  padding:15px;
  max-width:500px;
  margin:auto;
}

.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

input, select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-bottom:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.btn-primary{
  background:var(--rojo);
  color:white;
}

.btn-secondary{
  background:#ddd;
}

.resumen-item{
  border:1px solid #ececec;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
}

.resumen-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.resumen-pill{
  border-radius:999px;
  padding:6px 12px;
  font-size:13px;
  font-weight:bold;
}

.ok{background:var(--verde-suave); color:var(--verde);}
.mid{background:#fff4e5; color:#b26a00;}
.no{background:var(--rojo-suave); color:var(--rojo);}

.resumen-meta{
  font-size:12px;
  color:#666;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo-text">Coca-Cola</div>
  <h1>Cobertura por Cliente</h1>
  <p>Productos comprados en verde y pendientes en rojo</p>
</div>

<div class="content">

<div class="card">
<input id="searchCliente" placeholder="Ej: 3100979 o nombre">

<select id="clienteSelect"></select>

<button class="btn-primary" onclick="cargar()">Actualizar datos</button>
</div>

<div id="resumen"></div>

</div>

<script>
const SHEET_ID = "1SQAHZLQmBjkGeac7sEg9ChFQdwOVClcT";

const URL_CLIENTES = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=1063039588`;
const URL_COMPRAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=1594103549`;
const URL_COLAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=626208758`;
const URL_SABORES = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=540553642`;
const URL_STILLS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=317922023`;
const URL_MULTI = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=1454901180`;

let clientes=[], compras=[], categorias={};

function fetchCSV(url){
  return new Promise(resolve=>{
    Papa.parse(url,{
      download:true,
      header:true,
      complete:res=>resolve(res.data)
    });
  });
}

async function cargar(){
  clientes = await fetchCSV(URL_CLIENTES);
  compras = await fetchCSV(URL_COMPRAS);

  categorias.COLAS = await fetchCSV(URL_COLAS);
  categorias.SABORES = await fetchCSV(URL_SABORES);
  categorias.STILLS = await fetchCSV(URL_STILLS);
  categorias.MULTI = await fetchCSV(URL_MULTI);

  llenarClientes();
}

function llenarClientes(){
  const sel = document.getElementById("clienteSelect");
  sel.innerHTML = clientes.map(c=>`<option value="${c.Numero}">${c.Numero} - ${c.Cliente}</option>`).join("");
}

function renderResumen(cliente){
  const comprados = compras.filter(c=>c.Numero==cliente).map(c=>c.Producto);

  const cats = ["COLAS","SABORES","STILLS","MULTI"];

  const html = cats.map(cat=>{
    const lista = categorias[cat].map(x=>x.Producto);
    const total = lista.length;
    const ok = lista.filter(p=>comprados.includes(p)).length;
    const pct = total ? Math.round(ok/total*100) : 0;

    let clase="no";
    if(pct>=80) clase="ok";
    else if(pct>=40) clase="mid";

    return `
    <div class="resumen-item">
      <div class="resumen-top">
        <div>${cat}</div>
        <div class="resumen-pill ${clase}">${pct}%</div>
      </div>
      <div class="resumen-meta">${ok} de ${total} productos</div>
    </div>`;
  }).join("");

  document.getElementById("resumen").innerHTML = html;
}

document.getElementById("clienteSelect").addEventListener("change", e=>{
  renderResumen(e.target.value);
});
</script>

</body>
</html>
