<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referencias por Cliente</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 10px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .titulo {
      font-size: 18px;
      font-weight: bold;
    }

    .sub {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .ruta {
      float: right;
      background: #ffe5e5;
      color: #d90000;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25D366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .btn-whatsapp img {
      width: 20px;
      height: 20px;
    }

    .resumen {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      margin-top: 10px;
      padding-bottom: 4px;
    }

    .box {
      min-width: 120px;
      background: #fafafa;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #eee;
      flex-shrink: 0;
    }

    .verde { color: green; font-weight: bold; }
    .amarillo { color: orange; font-weight: bold; }
    .rojo { color: red; font-weight: bold; }

    .loading,
    .error {
      text-align: center;
      padding: 20px;
      color: #555;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="app">
    <div class="loading">Cargando datos...</div>
  </div>

  <script>
    const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQSuRpKllI3EgCIHu51oqxUVEVtsDYgt5LFX0iNFndhHeRfsKIy3RyGoLnfobWFw/pub?gid=1665268501&single=true&output=csv";

    const clientesData = [];

    function toNumber(valor) {
      if (valor === undefined || valor === null) return 0;
      const limpio = String(valor).replace(/"/g, '').replace(',', '.').trim();
      const numero = Number(limpio);
      return isNaN(numero) ? 0 : numero;
    }

    function escaparHTML(texto) {
      return String(texto ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }

      result.push(current);
      return result.map(v => v.trim());
    }

    function obtenerColor(porcentaje) {
      if (porcentaje >= 100) return "verde";
      if (porcentaje >= 80) return "amarillo";
      return "rojo";
    }

    function obtenerIcono(porcentaje) {
      if (porcentaje >= 100) return "🟢";
      if (porcentaje >= 80) return "🟡";
      return "🔴";
    }

    function renderClientes(lista) {
      const app = document.getElementById("app");
      app.innerHTML = "";

      if (!lista.length) {
        app.innerHTML = '<div class="error">No se encontraron datos para mostrar.</div>';
        return;
      }

      lista.forEach((cliente, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="titulo">
            ${escaparHTML(cliente.nombre)}
            <span class="ruta">Ruta ${escaparHTML(cliente.ruta)}</span>
          </div>
          <div class="sub">Categoría visible: Todas</div>

          <button class="btn-whatsapp" onclick="enviarWhatsAppPorIndice(${index})">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            Enviar avance por WhatsApp
          </button>

          <div class="resumen">
            ${cliente.categorias.map(cat => `
              <div class="box">
                <b>${escaparHTML(cat.nombre)}</b><br>
                <span class="${obtenerColor(cat.porcentaje)}">${cat.porcentaje}%</span><br>
                ${cat.cumplidas} de ${cat.total}
              </div>
            `).join("")}
          </div>
        `;

        app.appendChild(card);
      });
    }

    fetch(URL)
      .then(res => {
        if (!res.ok) throw new Error("No se pudo leer el CSV");
        return res.text();
      })
      .then(data => {
        const filas = data
          .replace(/\r/g, '')
          .split('\n')
          .filter(fila => fila.trim() !== '');

        if (filas.length <= 1) {
          throw new Error("El CSV no tiene datos");
        }

        const filasDatos = filas.slice(1);
        clientesData.length = 0;

        filasDatos.forEach(fila => {
          const c = parseCSVLine(fila);

          if (!c.length || (!c[0] && !c[1])) return;

          const cliente = {
            ruta: (c[0] || '').replace(/"/g, '').trim(),
            nombre: (c[1] || '').replace(/"/g, '').trim(),
            categorias: [
              { nombre: "Colas", porcentaje: toNumber(c[2]), cumplidas: toNumber(c[3]), total: 15, puntos: 0 },
              { nombre: "Sabores", porcentaje: toNumber(c[4]), cumplidas: toNumber(c[5]), total: 12, puntos: 5 },
              { nombre: "Stills", porcentaje: toNumber(c[6]), cumplidas: toNumber(c[7]), total: 20, puntos: 0 }
            ]
          };

          if (cliente.nombre || cliente.ruta) {
            clientesData.push(cliente);
          }
        });

        renderClientes(clientesData);
      })
      .catch(error => {
        console.error(error);
        document.getElementById("app").innerHTML = `
          <div class="error">
            Error al cargar los datos.<br>
            Revisá que el CSV esté publicado correctamente.
          </div>
        `;
      });

    function enviarWhatsAppPorIndice(index) {
      const cliente = clientesData[index];
      if (!cliente) return;
      enviarWhatsApp(cliente);
    }

    function enviarWhatsApp(cliente) {
      let mensaje = `📊 *Avance de Referencias*%0A`;
      mensaje += `Cliente: ${cliente.nombre}%0A`;
      mensaje += `Ruta: ${cliente.ruta}%0A%0A`;

      cliente.categorias.forEach(cat => {
        const icono = obtenerIcono(cat.porcentaje);

        mensaje += `${icono} *${cat.nombre}*%0A`;
        mensaje += `Avance: ${cat.porcentaje}%25%0A`;
        mensaje += `Referencias: ${cat.cumplidas} de ${cat.total}%0A`;
        mensaje += `Puntos: ${cat.puntos}%0A%0A`;
      });

      const url = `https://wa.me/?text=${mensaje}`;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
