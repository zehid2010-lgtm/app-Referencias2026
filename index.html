<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referencias por Cliente</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 10px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.titulo {
  font-size: 18px;
  font-weight: bold;
}

.sub {
  font-size: 13px;
  color: #666;
}

.ruta {
  float: right;
  background: #ffe5e5;
  color: #d90000;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.btn-whatsapp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #25D366;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
  font-weight: bold;
  cursor: pointer;
}

.btn-whatsapp img {
  width: 20px;
}

.resumen {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  margin-top: 10px;
}

.box {
  min-width: 120px;
  background: #fafafa;
  padding: 10px;
  border-radius: 10px;
}

.verde { color: green; }
.amarillo { color: orange; }
.rojo { color: red; }

</style>
</head>

<body>

<div id="app"></div>

<script>

// 🔗 TU CSV
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQSuRpKllI3EgCIHu51oqxUVEVtsDYgt5LFX0iNFndhHeRfsKIy3RyGoLnfobWFw/pub?gid=1665268501&single=true&output=csv";

fetch(URL)
  .then(res => res.text())
  .then(data => {
    const filas = data.split("\n").slice(1);
    const app = document.getElementById("app");

    filas.forEach(f => {
      const c = f.split(",");

      const cliente = {
        nombre: c[1],
        ruta: c[0],
        categorias: [
          { nombre: "Colas", porcentaje: Number(c[2]), cumplidas: Number(c[3]), total: 15, puntos: 0 },
          { nombre: "Sabores", porcentaje: Number(c[4]), cumplidas: Number(c[5]), total: 12, puntos: 5 },
          { nombre: "Stills", porcentaje: Number(c[6]), cumplidas: Number(c[7]), total: 20, puntos: 0 }
        ]
      };

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="titulo">${cliente.nombre}
          <span class="ruta">Ruta ${cliente.ruta}</span>
        </div>
        <div class="sub">Categoría visible: Todas</div>

        <button class="btn-whatsapp" onclick='enviarWhatsApp(${JSON.stringify(cliente)})'>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
          Enviar avance por WhatsApp
        </button>

        <div class="resumen">
          ${cliente.categorias.map(cat => {
            let color = "rojo";
            if (cat.porcentaje >= 100) color = "verde";
            else if (cat.porcentaje >= 80) color = "amarillo";

            return `
              <div class="box">
                <b>${cat.nombre}</b><br>
                <span class="${color}">${cat.porcentaje}%</span><br>
                ${cat.cumplidas} de ${cat.total}
              </div>
            `;
          }).join("")}
        </div>
      `;

      app.appendChild(card);
    });
  });


// 🚀 WHATSAPP PRO
function enviarWhatsApp(cliente) {
  let mensaje = `📊 *Avance de Referencias*\n`;
  mensaje += `Cliente: ${cliente.nombre}\n`;
  mensaje += `Ruta: ${cliente.ruta}\n\n`;

  cliente.categorias.forEach(cat => {

    let icono = '🔴';
    if (cat.porcentaje >= 100) icono = '🟢';
    else if (cat.porcentaje >= 80) icono = '🟡';

    mensaje += `${icono} *${cat.nombre}*\n`;
    mensaje += `Avance: ${cat.porcentaje}%\n`;
    mensaje += `Referencias: ${cat.cumplidas} de ${cat.total}\n`;
    mensaje += `Puntos: ${cat.puntos}\n\n`;
  });

  mensaje += `📈 Gracias por acompañar el desarrollo de la categoría.`;

  const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
}

</script>

</body>
</html>
